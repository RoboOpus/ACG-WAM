common:
  action_dim: 14
  state_dim: 14
  num_video_frames: 8
  video_height: 384
  video_width: 320
  global_downsample_rate: 3
  video_action_freq_ratio: 2
dataset:
  type: robotwin
  dataset_dir: /mnt/workspace/Tao/robotwin_dataset_organized
  data_mode: both
  task_mode: multi
  task_name: null
  task_names:
  - handover_mic
  - hanging_mug
  - move_can_pot
  - place_mouse_pad
  - put_object_cabinet
  - scan_object
  max_episodes: null
  image_aug: false
model:
  wan:
    config_path: /mnt/workspace/Tao/motus_LDJEPA/pretrained_models/Wan2.2-TI2V-5B
    checkpoint_path: /mnt/workspace/Tao/motus_LDJEPA/pretrained_models/Wan2.2-TI2V-5B
    vae_path: /mnt/workspace/Tao/motus_LDJEPA/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    precision: bfloat16
  vlm:
    checkpoint_path: /mnt/workspace/Tao/motus_LDJEPA/pretrained_models/Qwen3-VL-2B-Instruct
    precision: bfloat16
    frozen: true
  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1.0e-05
  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1.0e-05
    vlm:
      input_dim: 2048
      projector_type: mlp3x_silu
  time_distribution:
    timestep_sample_method: logit_normal
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0
  inference:
    num_inference_timesteps: 10
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999
training:
  batch_size: 4
  gradient_accumulation_steps: 16
  max_steps: 8000
  learning_rate: 5.0e-05
  weight_decay: 0.01
  scheduler_type: linear
  warmup_steps: 200
  # Must equal max_steps, otherwise the LR never anneals to f_min.
  cycle_length: 8000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false
  seed: 42
system:
  checkpoint_dir: ./checkpoints
  log_level: INFO
  log_interval: 20
  save_interval: 4000
  # 大于 max_steps 即全程不触发验证
  val_interval: 100000
  num_eval_batches: 16
  num_workers: 16
  pin_memory: true
logging:
  report_to: tensorboard
  wandb_project: motus
  tensorboard_log_dir: tensorboard_logs
  run_name: null
resume:
  checkpoint_path: null
finetune:
  checkpoint_path: /mnt/workspace/Tao/motus_LDJEPA/pretrained_models/Motus_robotwin2
  load_full_checkpoint: true
geometry_jepa:
  enable: true
  lambda_geo: 0.01
  cache_dir: /mnt/workspace/Tao/cache/vggt_teacher_robotwin
  teacher_protocol_id: vggt_tlayout_3view_percam_q32_d768_centered_v3
  horizon_choices:
  - 1
  - 2
  - 4
  - 8
  max_horizon: 8
  num_queries: 96
  hidden_dim: 768
  adapter_num_heads: 8
  adapter_depth: 1
  adapter_dropout: 0.0
  predictor_depth: 2
  predictor_num_heads: 8
  predictor_dropout: 0.0
  action_hidden_dim: 768
  target_mode: residual
  alpha_cos: 1.0
  beta_mse: 0.05
  gamma_token_cos: 1.0
  use_pool_cosine: true
  use_token_mse: true
  detach_target: true
  freeze_wam_for_geo: false
  lr_scale: 1.0
  log_grad_norm: true
